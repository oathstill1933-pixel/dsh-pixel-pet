<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信箱</title>
<link rel="stylesheet" href="mailbox.css">
</head>
<body>
<div class="shell">
  <header>
    <img id="icon" src="api/thumb/furniture/mailbox" alt="" width="36" height="42">
    <h1 class="title"><span id="owner">邮箱</span><small id="domain" hidden></small></h1>
    <span id="count" class="count" hidden></span>
    <span id="ext" class="ext" hidden></span>
    <div class="tools" role="toolbar">
      <button id="readAll" class="ib" type="button" title="全部已读" aria-label="全部已读" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M1.5 12.5 6 17l9.5-10M9 16l1 1 11.5-10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="starOnly" class="ib heart" type="button" title="收藏" aria-label="收藏" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.2-9.4C1.8 7.6 4 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.3 0 5.5 3.1 4.5 6.4-1.6 4.8-9.2 9.4-9.2 9.4z"/></svg>
      </button>
      <button id="clear" class="ib" type="button" title="清空" aria-label="清空">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M10 4h4M6.5 7l.9 12.1c.1 1 .9 1.9 2 1.9h5.2c1.1 0 1.9-.9 2-1.9L17.5 7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <main id="feed" aria-live="polite"></main>
  <form id="compose" autocomplete="off">
    <textarea id="text" rows="1" placeholder="写点什么…" maxlength="20000" aria-label="写信"></textarea>
    <button id="send" type="submit" aria-label="寄出" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z" fill="currentColor"/></svg>
    </button>
  </form>
</div>
<dialog id="confirm">
  <form method="dialog">
    <p id="cfText"></p>
    <label id="cfKeep" class="keep"><input id="cfKeepBox" type="checkbox" checked> 保留收藏 <span class="n" id="cfKeepN"></span></label>
    <menu>
      <button value="cancel" type="submit">取消</button>
      <button value="ok" type="submit" class="danger" id="cfOk">清空</button>
    </menu>
  </form>
</dialog>
<dialog id="box" class="box">
  <div class="box-bar"><span id="boxName"></span><button id="boxClose" type="button" aria-label="关闭">✕</button></div>
  <img id="boxImg" alt="" hidden>
  <iframe id="boxFrame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="" hidden></iframe>
</dialog>
<div id="toast" role="status" hidden></div>
<script src="mailbox.js"></script>
</body>
</html>
