<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一起看书</title>
<link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="reader.css?v=2">
</head>
<body>
<header id="bar">
  <button class="btn" id="link" title="打开链接" aria-label="打开链接">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
  </button>
  <button class="btn" id="file" title="打开 PDF" aria-label="打开 PDF">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
  </button>
  <button class="btn" id="recent" title="最近" aria-label="最近" aria-expanded="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
  </button>
  <span class="sep"></span>
  <button class="btn" id="back" title="后退" aria-label="后退" hidden>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div id="title"><span id="name"></span><span id="meta"></span></div>
  <form id="urlform" hidden><input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="网址或本地 PDF 路径"></form>
  <button class="btn" id="marks" title="留存" aria-label="留存" aria-expanded="false" hidden>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span class="badge" id="marksCount" hidden></span>
  </button>
  <button class="btn" id="external" title="在浏览器打开" aria-label="在浏览器打开" hidden>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
  </button>
</header>

<main id="stage">
  <section id="home" hidden>
    <ul id="recentList"></ul>
    <div id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 1 3 17z"/><path d="M21 5.5A1.5 1.5 0 0 0 19.5 4H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h6a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
    </div>
  </section>
  <section id="off" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 1 3 17z"/><path d="M21 5.5A1.5 1.5 0 0 0 19.5 4H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h6a1.5 1.5 0 0 0 1.5-1.5z"/><path d="M4 4l16 16"/></svg>
  </section>
  <section id="marksView" hidden>
    <ol id="marksList"></ol>
    <div id="marksEmpty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </div>
  </section>
  <div id="pdfwrap" hidden><div id="viewer" class="pdfViewer removePageBorders"></div></div>
  <div id="webwrap" hidden><article id="article"></article></div>
  <div id="loading" hidden><span></span><span></span><span></span></div>
</main>

<div id="bubble" hidden>
  <button type="button" id="bubbleChat"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg><span id="bubbleText">和 ta 聊</span></button>
</div>

<div class="card" id="card" hidden role="dialog" aria-label="提问">
  <button class="btn" id="x" title="关闭 (Esc)" aria-label="关闭"><svg class="ico" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <blockquote id="quote"></blockquote>
  <textarea id="q" rows="1" placeholder="想说点什么…"></textarea>
  <div class="row">
    <button class="btn" id="keep" aria-pressed="false" title="留存这段划线">
      <svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>留存</span>
    </button>
    <button class="btn" id="mic" aria-pressed="false" title="说话" aria-label="说话">
      <svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="btn" id="confirmVoice" aria-pressed="false" title="说完先确认再发" aria-label="说完先确认再发">
      <svg class="ico" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <span class="wave" id="wave" hidden aria-hidden="true"></span>
    <span class="dots" id="thinking" hidden><span></span><span></span><span></span></span>
    <span class="kept" id="keptMark" hidden><svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span class="grow"></span>
    <button class="btn" id="send" title="发送：这段原文、前后文与页码 (Enter)" aria-label="发送" disabled>
      <svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <p class="said" id="said" hidden></p>
  <div class="answer" id="answer" hidden><img id="ava" alt=""><p id="answerText"></p></div>
  <div id="err" role="status"></div>
</div>

<div id="drop" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>
</div>
<div id="toast" role="status"></div>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
